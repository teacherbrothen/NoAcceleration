<!DOCTYPE html>
<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinematics Equation Solver - Equation 2</title>
    
    <!-- KaTeX CSS & JS Engine -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

       body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background-color: #f8fafc;
    color: #1e293b;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 98vh;
    margin: 0;
    padding: 20px 20px 0 20px;
}

        .container {
            background-color: #ffffff;
            padding: 36px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            text-align: center;
            max-width: 760px;
            width: 100%;
            border: 1px solid #e2e8f0;
        }

        h2 {
            color: #0f172a;
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .instructions {
            color: #64748b;
            margin-bottom: 20px;
            font-size: 1.05rem;
            min-height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* Equation Layout Elements */
        .equation-box {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 30px 0;
            min-height: 160px;
            user-select: none;
            font-size: 2.8rem;
        }

        .side {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }

        .equals {
            margin: 0 16px;
            font-size: 2.2rem;
            color: #334155;
        }

        .sign {
            margin: 0 6px;
            font-size: 1.8rem;
            color: #334155;
        }

        .parens {
            font-size: 3.2rem;
            font-weight: 300;
            color: #334155;
            margin: 0 2px;
        }

        /* Fraction CSS Structure */
        .fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            margin: 0 4px;
            vertical-align: middle;
        }

        .numerator {
            padding: 2px 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .fraction-bar {
            border-bottom: 3px solid #1e293b;
            width: 100%;
        }

        .denominator {
            padding: 4px 8px 2px 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Interactive Discrete Terms */
        .var {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 8px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px dashed #cbd5e1;
            background-color: #f8fafc;
            margin: 0 2px;
        }

        .var:hover:not(.static-term) {
            background-color: #e2e8f0;
            border-color: #94a3b8;
        }

        .term-group {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 10px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px dashed #cbd5e1;
            background-color: #f8fafc;
        }

        .term-group:hover {
            background-color: #e2e8f0;
            border-color: #94a3b8;
        }

        .selected {
            background-color: #4f46e5 !important;
            color: #ffffff !important;
            border: 2px solid #4338ca !important;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .selected .katex {
            color: #ffffff !important;
        }

        .static-term {
            cursor: default;
            border: none;
            background: transparent;
            padding: 4px 2px;
        }

        /* Action Panel */
        .action-panel {
            background-color: #f8fafc;
            padding: 24px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .action-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #64748b;
            margin-bottom: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .action-label .katex {
            text-transform: none !important;
            font-size: 1.15rem;
            color: #4f46e5;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            max-width: 440px;
            margin: 0 auto;
            width: 100%;
        }

        .choice-grid {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
            max-width: 540px;
        }

        button {
            padding: 10px 16px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 10px;
            border: 1.5px solid #cbd5e1;
            background-color: #ffffff;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        button:hover:not(:disabled) {
            background-color: #4f46e5;
            color: #ffffff;
            border-color: #4f46e5;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2);
        }

        button:disabled {
            border-color: #f1f5f9;
            background-color: #f8fafc;
            color: #cbd5e1;
            cursor: not-allowed;
        }

        .choice-grid button {
            font-size: 1.15rem;
            padding: 12px 20px;
        }

        .choice-grid button .katex {
            font-size: 1.25rem !important;
            margin-left: 0.35em;
        }

        .hidden {
            display: none !important;
        }

        /* Feedback Engine */
        #feedback {
            font-weight: 600;
            font-size: 0.95rem;
            min-height: 28px;
            margin-top: 10px;
            margin-bottom: 10px;
            color: #ef4444;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        #feedback.success {
            color: #16a34a;
        }

        .shake {
            animation: shake 0.35s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .reset-btn {
            background: none;
            border: none;
            text-decoration: underline;
            color: #94a3b8;
            cursor: pointer;
            margin-top: 15px;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .reset-btn:hover {
            color: #475569;
            background: none;
            box-shadow: none;
        }
    </style>
</head><body><div class="container">
<h2>Kinematics Equation Solver</h2>
<div id="setup-screen">
<p class="instructions">Choose a variable to isolate from the baseline kinematics equation.</p>
<div id="landing-eq-container" class="equation-box"></div>
<div class="choice-grid"><button onclick="startSim('t')">Solve for&nbsp;<span id="btn-t"></span></button> <button onclick="startSim('v1')">Solve for&nbsp;<span id="btn-v1"></span></button> <button onclick="startSim('v2')">Solve for&nbsp;<span id="btn-v2"></span></button></div>
</div>
<div id="main-sim" class="hidden">
<p class="instructions" id="dynamic-instruction"></p>
<div id="equation-container" class="equation-box"></div>
<div class="action-panel">
<div class="action-label" id="panel-status">Select a variable to move</div>
<div id="op-buttons" class="btn-grid"><button class="act-btn" disabled="disabled" onclick="handleOp('add')">Add</button> <button class="act-btn" disabled="disabled" onclick="handleOp('subtract')">Subtract</button> <button class="act-btn" disabled="disabled" onclick="handleOp('multiply')">Multiply</button> <button class="act-btn" disabled="disabled" onclick="handleOp('divide')">Divide</button></div>
<div id="choice-buttons" class="choice-grid hidden"><button onclick="handleGroupChoice('v1')">Move&nbsp;<span id="btn-choice-v1"></span></button> <button onclick="handleGroupChoice('v2')">Move&nbsp;<span id="btn-choice-v2"></span></button> <button onclick="handleGroupChoice('both')">Move both&nbsp;<span id="btn-choice-both"></span></button></div>
</div>
<div id="feedback"></div>
<button class="reset-btn" onclick="resetSim()">Start Over</button></div>
</div>
<p><script>
    let state = 0; 
    let targetVar = null; 
    let currentFocus = null;

    const setupScreen = document.getElementById('setup-screen');
    const mainSim = document.getElementById('main-sim');
    const dynamicInstruction = document.getElementById('dynamic-instruction');
    const feedback = document.getElementById('feedback');
    const panelStatus = document.getElementById('panel-status');
    const opButtons = document.getElementById('op-buttons');
    const choiceButtons = document.getElementById('choice-buttons');
    const actionBtns = document.querySelectorAll('.act-btn');
    const eqContainer = document.getElementById('equation-container');

    // Safe KaTeX Helper
    function kRender(latex, sizeStyle = '') {
        try {
            const rendered = katex.renderToString(latex, { throwOnError: false });
            if (sizeStyle) {
                return `<span style="font-size: ${sizeStyle};">${rendered}</span>`;
            }
            return rendered;
        } catch (e) {
            return latex;
        }
    }

    // Initialize UI Labels with KaTeX
    function initLabels() {
        document.getElementById('landing-eq-container').innerHTML = kRender('d = \\left(\\frac{v_1 + v_2}{2}\\right)t', '3.2rem');
        document.getElementById('btn-t').innerHTML = kRender('t');
        document.getElementById('btn-v1').innerHTML = kRender('v_1');
        document.getElementById('btn-v2').innerHTML = kRender('v_2');
        document.getElementById('btn-choice-v1').innerHTML = kRender('v_1');
        document.getElementById('btn-choice-v2').innerHTML = kRender('v_2');
        document.getElementById('btn-choice-both').innerHTML = kRender('(v_1 + v_2)');
    }

    function startSim(variable) {
        targetVar = variable;
        state = 0;
        currentFocus = null;
        setupScreen.classList.add('hidden');
        mainSim.classList.remove('hidden');
        let displayVar = targetVar === 'v1' ? kRender('v_1') : (targetVar === 'v2' ? kRender('v_2') : kRender('t'));
        dynamicInstruction.innerHTML = `Rearrange the equation to isolate ${displayVar}.`;
        render();
    }

    function render() {
        showUI('ops');
        enableOps(false);
        feedback.innerHTML = "";
        feedback.className = "";

        if (targetVar === 't') {
            renderIsolateT();
        } else if (targetVar === 'v1') {
            renderIsolateV1();
        } else if (targetVar === 'v2') {
            renderIsolateV2();
        }
    }

    // --- WORKFLOW FOR ISOLATING T ---
    function renderIsolateT() {
        if (state === 0) {
            eqContainer.innerHTML = `
                <div class="side"><span class="var" onclick="selectVarT('d', this)">${kRender('d')}</span></div>
                <span class="equals">=</span>
                <div class="side">
                    <span class="parens">(</span>
                    <div class="fraction">
                        <div class="numerator fraction-bar">
                            <span class="var" onclick="selectVarT('v1', this)">${kRender('v_1')}</span><span class="sign">+</span><span class="var" onclick="selectVarT('v2', this)">${kRender('v_2')}</span>
                        </div>
                        <div class="denominator"><span class="var" onclick="selectVarT('2', this)">${kRender('2')}</span></div>
                    </div>
                    <span class="parens">)</span>
                    <span class="var" onclick="selectVarT('t', this)">${kRender('t')}</span>
                </div>`;
            panelStatus.innerHTML = "SELECT A VARIABLE OR TERM TO MOVE";
        } else if (state === 1) {
            eqContainer.innerHTML = `
                <div class="side">
                    <span class="var static-term" style="margin-right:2px;">${kRender('2')}</span><span class="var" onclick="selectVarT('d', this)">${kRender('d')}</span>
                </div>
                <span class="equals">=</span>
                <div class="side">
                    <span class="parens">(</span>
                    <div class="term-group" id="parentheses-block" onclick="selectGroupT(this)">
                        ${kRender('v_1')}<span class="sign">+</span>${kRender('v_2')}
                    </div>
                    <span class="parens">)</span>
                    <span class="var" onclick="selectVarT('t', this)">${kRender('t')}</span>
                </div>`;
            panelStatus.innerHTML = "SELECT A VARIABLE OR TERM TO MOVE";
        } else if (state === 2) {
            eqContainer.innerHTML = `
                <div class="side">
                    <div class="fraction">
                        <div class="numerator fraction-bar">
                            <span class="var static-term" style="margin-right:2px;">${kRender('2')}</span><span class="var static-term">${kRender('d')}</span>
                        </div>
                        <div class="denominator">
                            <span class="parens" style="font-size:1.8rem; margin:0 2px;">(</span>${kRender('v_1')}<span class="sign" style="font-size:1.2rem; margin:0 2px;">+</span>${kRender('v_2')}<span class="parens" style="font-size:1.8rem; margin:0 2px;">)</span>
                        </div>
                    </div>
                </div>
                <span class="equals">=</span>
                <div class="side">
                    <span class="var static-term">${kRender('t')}</span>
                </div>`;
            panelStatus.innerHTML = `<span style="color: #16a34a;">EQUATION SOLVED!</span>`;
            feedback.innerHTML = `Success! You've isolated&nbsp;${kRender('t')}.`;
            feedback.className = "success";
        }
    }

    function selectVarT(id, el) {
        if (state === 2) return;
        resetSelection();
        el.classList.add('selected');
        currentFocus = id;

        if (id === 'd') {
            showError(`Move variables away from the side containing ${kRender('t')}.`);
        } else if (id === 't') {
            showError("We don't want to move this.");
        } else if ((id === 'v1' || id === 'v2') && state === 0) {
            showError("This can't be moved in one step.");
        } else if (id === '2' && state === 0) {
            panelStatus.innerHTML = `SELECT THE OPPOSITE OPERATION TO APPLY TO ${kRender('2')}`;
            enableOps(true);
        }
    }

    function selectGroupT(el) {
        if (state !== 1) return;
        resetSelection();
        el.classList.add('selected');
        panelStatus.innerHTML = "WHAT DO YOU WANT TO MOVE?";
        showUI('choices');
        currentFocus = 'parentheses';
    }

    // --- WORKFLOW FOR ISOLATING V1 ---
    function renderIsolateV1() {
        if (state === 0) {
            eqContainer.innerHTML = `
                <div class="side"><span class="var" onclick="selectVarV1('d', this)">${kRender('d')}</span></div>
                <span class="equals">=</span>
                <div class="side">
                    <span class="parens">(</span>
                    <div class="fraction">
                        <div class="numerator fraction-bar">
                            <span class="var" onclick="selectVarV1('v1', this)">${kRender('v_1')}</span><span class="sign">+</span><span class="var" onclick="selectVarV1('v2', this)">${kRender('v_2')}</span>
                        </div>
                        <div class="denominator"><span class="var" onclick="selectVarV1('2', this)">${kRender('2')}</span></div>
                    </div>
                    <span class="parens">)</span>
                    <span class="var" onclick="selectVarV1('t', this)">${kRender('t')}</span>
                </div>`;
            panelStatus.innerHTML = "SELECT A VARIABLE OR TERM TO MOVE";
        } else if (state === 1) {
            eqContainer.innerHTML = `
                <div class="side">
                    <div class="fraction">
                        <div class="numerator fraction-bar"><span class="var" onclick="selectVarV1('d', this)">${kRender('d')}</span></div>
                        <div class="denominator"><span class="var" onclick="selectVarV1('t', this)">${kRender('t')}</span></div>
                    </div>
                </div>
                <span class="equals">=</span>
                <div class="side">
                    <span class="parens">(</span>
                    <div class="fraction">
                        <div class="numerator fraction-bar">
                            <span class="var" onclick="selectVarV1('v1', this)">${kRender('v_1')}</span><span class="sign">+</span><span class="var" onclick="selectVarV1('v2', this)">${kRender('v_2')}</span>
                        </div>
                        <div class="denominator"><span class="var" onclick="selectVarV1('2', this)">${kRender('2')}</span></div>
                    </div>
                    <span class="parens">)</span>
                </div>`;
            panelStatus.innerHTML = "SELECT A VARIABLE OR TERM TO MOVE";
        } else if (state === 2) {
            eqContainer.innerHTML = `
                <div class="side">
                    <div class="fraction">
                        <div class="numerator fraction-bar">
                            <span class="var static-term" style="margin-right:2px;">${kRender('2')}</span><span class="var" onclick="selectVarV1('d', this)">${kRender('d')}</span>
                        </div>
                        <div class="denominator"><span class="var" onclick="selectVarV1('t', this)">${kRender('t')}</span></div>
                    </div>
                </div>
                <span class="equals">=</span>
                <div class="side">
                    <span class="var" onclick="selectVarV1('v1', this)">${kRender('v_1')}</span><span class="sign">+</span><span class="var" onclick="selectVarV1('v2', this)">${kRender('v_2')}</span>
                </div>`;
            panelStatus.innerHTML = "SELECT A VARIABLE OR TERM TO MOVE";
        } else if (state === 3) {
            eqContainer.innerHTML = `
                <div class="side">
                    <div class="fraction">
                        <div class="numerator fraction-bar">
                            <span class="var static-term" style="margin-right:2px;">${kRender('2')}</span><span class="var static-term">${kRender('d')}</span>
                        </div>
                        <div class="denominator"><span class="var static-term">${kRender('t')}</span></div>
                    </div>
                    <span class="sign">-</span><span class="var static-term">${kRender('v_2')}</span>
                </div>
                <span class="equals">=</span>
                <div class="side">
                    <span class="var static-term">${kRender('v_1')}</span>
                </div>`;
            panelStatus.innerHTML = `<span style="color: #16a34a;">EQUATION SOLVED!</span>`;
            feedback.innerHTML = `Success! You've isolated&nbsp;${kRender('v_1')}.`;
            feedback.className = "success";
        }
    }

    function selectVarV1(id, el) {
        if (state === 3) return;
        resetSelection();
        el.classList.add('selected');
        currentFocus = id;

        if (state === 0) {
            if (id === 'v1') showError("We don't want to move this.");
            else if (id === '2') showError("Let's work outside of the brackets first.");
            else if (id === 'v2') showError("You can't move that in one step.");
            else if (id === 'd') showError(`Move variables away from the side containing ${kRender('v_1')}.`);
            else if (id === 't') {
                panelStatus.innerHTML = `SELECT THE OPPOSITE OPERATION TO APPLY TO ${kRender('t')}`;
                enableOps(true);
            }
        } 
        else if (state === 1) {
            if (id === '2') {
                panelStatus.innerHTML = `SELECT THE OPPOSITE OPERATION TO APPLY TO ${kRender('2')}`;
                enableOps(true);
            }
            else if (id === 'v2') showError("You can't move that in one step.");
            else if (id === 'v1') showError("We don't want to move this.");
            else if (id === 'd' || id === 't') showError(`Move variables away from the side containing ${kRender('v_1')}.`);
        } 
        else if (state === 2) {
            if (id === 'v1') showError("We don't want to move this.");
            else if (id === 'v2') {
                panelStatus.innerHTML = `SELECT THE OPPOSITE OPERATION TO APPLY TO ${kRender('v_2')}`;
                enableOps(true);
            }
            else if (id === 'd' || id === 't') showError(`Move variables away from the side containing ${kRender('v_1')}.`);
        }
    }

    // --- WORKFLOW FOR ISOLATING V2 ---
    function renderIsolateV2() {
        if (state === 0) {
            eqContainer.innerHTML = `
                <div class="side"><span class="var" onclick="selectVarV2('d', this)">${kRender('d')}</span></div>
                <span class="equals">=</span>
                <div class="side">
                    <span class="parens">(</span>
                    <div class="fraction">
                        <div class="numerator fraction-bar">
                            <span class="var" onclick="selectVarV2('v1', this)">${kRender('v_1')}</span><span class="sign">+</span><span class="var" onclick="selectVarV2('v2', this)">${kRender('v_2')}</span>
                        </div>
                        <div class="denominator"><span class="var" onclick="selectVarV2('2', this)">${kRender('2')}</span></div>
                    </div>
                    <span class="parens">)</span>
                    <span class="var" onclick="selectVarV2('t', this)">${kRender('t')}</span>
                </div>`;
            panelStatus.innerHTML = "SELECT A VARIABLE OR TERM TO MOVE";
        } else if (state === 1) {
            eqContainer.innerHTML = `
                <div class="side">
                    <div class="fraction">
                        <div class="numerator fraction-bar"><span class="var" onclick="selectVarV2('d', this)">${kRender('d')}</span></div>
                        <div class="denominator"><span class="var" onclick="selectVarV2('t', this)">${kRender('t')}</span></div>
                    </div>
                </div>
                <span class="equals">=</span>
                <div class="side">
                    <span class="parens">(</span>
                    <div class="fraction">
                        <div class="numerator fraction-bar">
                            <span class="var" onclick="selectVarV2('v1', this)">${kRender('v_1')}</span><span class="sign">+</span><span class="var" onclick="selectVarV2('v2', this)">${kRender('v_2')}</span>
                        </div>
                        <div class="denominator"><span class="var" onclick="selectVarV2('2', this)">${kRender('2')}</span></div>
                    </div>
                    <span class="parens">)</span>
                </div>`;
            panelStatus.innerHTML = "SELECT A VARIABLE OR TERM TO MOVE";
        } else if (state === 2) {
            eqContainer.innerHTML = `
                <div class="side">
                    <div class="fraction">
                        <div class="numerator fraction-bar">
                            <span class="var static-term" style="margin-right:2px;">${kRender('2')}</span><span class="var" onclick="selectVarV2('d', this)">${kRender('d')}</span>
                        </div>
                        <div class="denominator"><span class="var" onclick="selectVarV2('t', this)">${kRender('t')}</span></div>
                    </div>
                </div>
                <span class="equals">=</span>
                <div class="side">
                    <span class="var" onclick="selectVarV2('v1', this)">${kRender('v_1')}</span><span class="sign">+</span><span class="var" onclick="selectVarV2('v2', this)">${kRender('v_2')}</span>
                </div>`;
            panelStatus.innerHTML = "SELECT A VARIABLE OR TERM TO MOVE";
        } else if (state === 3) {
            eqContainer.innerHTML = `
                <div class="side">
                    <div class="fraction">
                        <div class="numerator fraction-bar">
                            <span class="var static-term" style="margin-right:2px;">${kRender('2')}</span><span class="var static-term">${kRender('d')}</span>
                        </div>
                        <div class="denominator"><span class="var static-term">${kRender('t')}</span></div>
                    </div>
                    <span class="sign">-</span><span class="var static-term">${kRender('v_1')}</span>
                </div>
                <span class="equals">=</span>
                <div class="side">
                    <span class="var static-term">${kRender('v_2')}</span>
                </div>`;
            panelStatus.innerHTML = `<span style="color: #16a34a;">EQUATION SOLVED!</span>`;
            feedback.innerHTML = `Success! You've isolated&nbsp;${kRender('v_2')}.`;
            feedback.className = "success";
        }
    }

    function selectVarV2(id, el) {
        if (state === 3) return;
        resetSelection();
        el.classList.add('selected');
        currentFocus = id;

        if (state === 0) {
            if (id === 'v2') showError("We don't want to move this.");
            else if (id === '2') showError("Let's work outside of the brackets first.");
            else if (id === 'v1') showError("You can't move that in one step.");
            else if (id === 'd') showError(`Move variables away from the side containing ${kRender('v_2')}.`);
            else if (id === 't') {
                panelStatus.innerHTML = `SELECT THE OPPOSITE OPERATION TO APPLY TO ${kRender('t')}`;
                enableOps(true);
            }
        } 
        else if (state === 1) {
            if (id === '2') {
                panelStatus.innerHTML = `SELECT THE OPPOSITE OPERATION TO APPLY TO ${kRender('2')}`;
                enableOps(true);
            }
            else if (id === 'v1') showError("You can't move that in one step.");
            else if (id === 'v2') showError("We don't want to move this.");
            else if (id === 'd' || id === 't') showError(`Move variables away from the side containing ${kRender('v_2')}.`);
        } 
        else if (state === 2) {
            if (id === 'v2') showError("We don't want to move this.");
            else if (id === 'v1') {
                panelStatus.innerHTML = `SELECT THE OPPOSITE OPERATION TO APPLY TO ${kRender('v_1')}`;
                enableOps(true);
            }
            else if (id === 'd' || id === 't') showError(`Move variables away from the side containing ${kRender('v_2')}.`);
        }
    }

    // --- OPERATION EXECUTIONS ---
    function handleGroupChoice(choice) {
        feedback.innerHTML = "";
        if (choice === 'v1' || choice === 'v2') {
            showError("You can't move a term that is part of a factor.");
        } else if (choice === 'both') {
            panelStatus.innerHTML = `SELECT THE OPPOSITE OPERATION TO APPLY TO ${kRender('(v_1 + v_2)')}`;
            showUI('ops');
            enableOps(true);
        }
    }

    function handleOp(op) {
        if (targetVar === 't') {
            if (currentFocus === '2' && state === 0 && op === 'multiply') {
                state = 1; render();
            } else if (currentFocus === 'parentheses' && state === 1 && op === 'divide') {
                state = 2; render();
            } else {
                showError("Select the opposite operation.");
            }
        } 
        else if (targetVar === 'v1') {
            if (currentFocus === 't' && state === 0 && op === 'divide') {
                state = 1; render();
            } else if (currentFocus === '2' && state === 1 && op === 'multiply') {
                state = 2; render();
            } else if (currentFocus === 'v2' && state === 2 && op === 'subtract') {
                state = 3; render();
            } else {
                showError("Select the opposite operation.");
            }
        }
        else if (targetVar === 'v2') {
            if (currentFocus === 't' && state === 0 && op === 'divide') {
                state = 1; render();
            } else if (currentFocus === '2' && state === 1 && op === 'multiply') {
                state = 2; render();
            } else if (currentFocus === 'v1' && state === 2 && op === 'subtract') {
                state = 3; render();
            } else {
                showError("Select the opposite operation.");
            }
        }
    }

    function showUI(type) {
        if (type === 'ops') {
            opButtons.classList.remove('hidden');
            choiceButtons.classList.add('hidden');
        } else {
            opButtons.classList.add('hidden');
            choiceButtons.classList.remove('hidden');
        }
    }

    function enableOps(status) {
        actionBtns.forEach(btn => btn.disabled = !status);
    }

    function resetSelection() {
        document.querySelectorAll('.var, .term-group').forEach(el => el.classList.remove('selected'));
        feedback.innerHTML = "";
        feedback.classList.remove('shake');
    }

    function showError(msg) {
        feedback.innerHTML = msg;
        feedback.className = "";
        feedback.classList.remove('shake');
        void feedback.offsetWidth;
        feedback.classList.add('shake');
    }

    function resetSim() {
        targetVar = null;
        state = 0;
        currentFocus = null;
        mainSim.classList.add('hidden');
        setupScreen.classList.remove('hidden');
        feedback.innerHTML = "";
    }

    initLabels();
</script></p></body></html>
